name: Verification du code Python

on:
  push:
    branches: [main, dev, feature/polaris, feature/gold]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

# Bash explicite : un echec dans un pipe doit rendre le job rouge.
defaults:
  run:
    shell: bash

jobs:
  verification:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v5

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Verifier la syntaxe Python
        run: python -m compileall -q ingestion transformation tests


      - name: Tester les ingestions sans reseau ni connexion Neon
        run: python -m unittest discover -s tests -p 'test_ingestion*.py' -v

      - name: Tester les prerequis geospatiaux et les references annuelles
        run: python -m unittest discover -s tests -p 'test_gold_*.py' -v

  tests-neon:
    if: github.event_name == 'workflow_dispatch'
    needs: verification
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: neon-ci-test-123
      cancel-in-progress: false
    env:
      RUN_NEON_TESTS: '1'
      TEST_BRONZE_DATABASE_URL: ${{ secrets.TEST_BRONZE_DATABASE_URL }}
      TEST_SILVER_DATABASE_URL: ${{ secrets.TEST_SILVER_DATABASE_URL }}
      TEST_NEON_HOST: ${{ vars.TEST_NEON_HOST }}
      SPARK_LOCAL_IP: '127.0.0.1'
      PYTHONUNBUFFERED: '1'
      # Charger JDBC au lancement de la JVM, avant le premier contexte meteo.
      PYSPARK_SUBMIT_ARGS: '--packages org.postgresql:postgresql:42.7.8 pyspark-shell'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Installer les dependances
        run: pip install -r requirements.txt
      - name: Tester les connexions et les marqueurs sans ecriture
        run: |
          python -c "import sys; sys.path.insert(0, 'tests'); from neon_support import guarded_connections; guarded_connections(); print('Connexions de test et marqueurs valides')"
      - name: Verifier le pilote PostgreSQL avant les tests
        run: |
          set -euo pipefail
          python - <<'PY'
          from pyspark.sql import SparkSession
          for passage in (1, 2):
              spark = SparkSession.builder.master('local[1]').appName('VerificationJDBC').getOrCreate()
              try:
                  loader = spark._jvm.java.lang.Thread.currentThread().getContextClassLoader()
                  driver = loader.loadClass('org.postgresql.Driver')
                  print(f'Pilote JDBC disponible, demarrage {passage} : {driver.getName()}')
              finally:
                  spark.stop()
          PY
      - name: Integration et bout en bout sur Neon de test
        run: |
          set -euo pipefail
          mkdir -p reports
          python -m unittest discover -s tests -p 'test_neon_*.py' -v 2>&1 | tee reports/neon-tests.log
      - name: Conserver le rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-neon-${{ github.run_id }}
          path: reports/
          if-no-files-found: ignore
          retention-days: 7

