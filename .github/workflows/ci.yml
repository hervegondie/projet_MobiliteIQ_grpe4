name: Verification du code Python

on:
  push:
    branches: [main, dev, feature/polaris]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verification:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v5

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Verifier la syntaxe Python
        run: python -m compileall -q ingestion transformation tests


      - name: Tester les ingestions sans reseau ni connexion Neon
        run: python -m unittest discover -s tests -p 'test_ingestion*.py' -v
