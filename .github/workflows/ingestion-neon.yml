name: Ingestion Travaux vers Neon

on:
  # Toutes les heures, à la minute 35.
  schedule:
    - cron: '35 * * * *'

  # Permet aussi un lancement depuis le bouton Run workflow.
  workflow_dispatch:

permissions:
  contents: read

# Éviter deux exécutions simultanées de ce workflow.
concurrency:
  group: ingestion-travaux-neon
  cancel-in-progress: false

jobs:
  travaux:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Installer les dependances
        run: python -m pip install -r requirements.txt

      - name: Executer ingestion Travaux
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONUNBUFFERED: '1'
          SPARK_LOCAL_IP: 127.0.0.1
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Ajouter le secret Actions DATABASE_URL."
            exit 1
          fi

          python ingestion/ingestion_travaux.py
