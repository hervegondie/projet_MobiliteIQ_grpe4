name: Meteo quotidienne 6 points vers Silver_test

on:
  schedule:
    - cron: '5 7 * * *'
  workflow_dispatch:
    inputs:
      csv_seulement:
        description: 'Verifier les six lieux sans connexion ni ecriture Neon'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: meteo-quotidienne-et-gold
  cancel-in-progress: false

jobs:
  meteo-points:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BRONZE_DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SILVER_DATABASE_URL: ${{ secrets.SILVER_DATABASE_URL }}
      METEO_POINTS: config/points_meteo_quebec.json
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-meteo-horaire.txt
      - name: Installer les dependances
        run: python -m pip install -r requirements-meteo-horaire.txt -r requirements-gold.txt
      - name: Tests rapides avant ingestion
        run: |
          mkdir -p reports
          python -m compileall -q ingestion transformation tests
          python -m unittest discover -s tests -p 'test_ingestion*.py' -v 2>&1 | tee reports/tests-meteo-quotidienne-points.log
      - name: Tests Gold avant toute publication
        run: |
          python -m unittest discover -s tests -p 'test_gold_*.py' -v
      - name: Verifier les connexions sans ecriture
        if: ${{ success() && (github.event_name != 'workflow_dispatch' || !inputs.csv_seulement) }}
        run: |
          python - <<'PY'
          from transformation.integration_meteo_horaire import connexion
          with connexion('bronze', readonly=True), connexion('silver', readonly=True):
              print('Connexions Bronze et Silver valides')
          PY
      - name: Collecter les sept derniers jours pour les six lieux
        run: |
          options=()
          if [ "${{ github.event_name == 'workflow_dispatch' && inputs.csv_seulement || false }}" = "true" ]; then
            options+=(--csv-seulement)
          fi
          python ingestion/ingestion_meteo.py --points "$METEO_POINTS" --jours 7 --output-dir ingestion/output_meteo_points "${options[@]}"
      - name: Transformer le lot quotidien vers Silver
        if: ${{ success() && (github.event_name != 'workflow_dispatch' || !inputs.csv_seulement) }}
        run: python transformation/transformation_meteo_quotidienne_points.py --manifest reports/collecte_meteo_quotidienne_points.json --apply
      - name: Verifier les lignes reellement chargees
        if: ${{ success() && (github.event_name != 'workflow_dispatch' || !inputs.csv_seulement) }}
        run: python transformation/transformation_meteo_quotidienne_points.py --manifest reports/collecte_meteo_quotidienne_points.json --verifier --rapport reports/qualite_meteo_quotidienne_points.json
      - name: Construire Gold apres la meteo Silver validee
        if: ${{ success() && (github.event_name != 'workflow_dispatch' || !inputs.csv_seulement) }}
        run: python transformation/situations_journalieres.py --jours 7 --apply
      - name: Verifier la publication Gold de la veille
        if: ${{ success() && (github.event_name != 'workflow_dispatch' || !inputs.csv_seulement) }}
        run: python scripts/controler_gold_automatisation.py journalier --rapport reports/situations_journalieres.json
      - name: Actualiser Power BI apres validation Gold
        if: ${{ success() && vars.PBI_REFRESH_ENABLED == 'true' && (github.event_name != 'workflow_dispatch' || !inputs.csv_seulement) }}
        env:
          PBI_TENANT_ID: ${{ vars.PBI_TENANT_ID }}
          PBI_CLIENT_ID: ${{ vars.PBI_CLIENT_ID }}
          PBI_CLIENT_SECRET: ${{ secrets.PBI_CLIENT_SECRET }}
          PBI_WORKSPACE_ID: ${{ vars.PBI_WORKSPACE_ID }}
          PBI_DATASET_ID: ${{ vars.PBI_DATASET_ID }}
        run: python scripts/actualiser_powerbi.py
      - name: Indiquer que Power BI reste desactive
        if: ${{ success() && vars.PBI_REFRESH_ENABLED != 'true' && (github.event_name != 'workflow_dispatch' || !inputs.csv_seulement) }}
        run: echo 'Gold valide ; Power BI non actualise car PBI_REFRESH_ENABLED ne vaut pas true.' >> "$GITHUB_STEP_SUMMARY"
      - name: Conserver les rapports et le brut
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meteo-quotidienne-points-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reports/
            ingestion/output_meteo_points/
          retention-days: 3
          if-no-files-found: ignore
      - name: Signaler un echec
        if: failure()
        run: |
          echo '### Meteo quotidienne multi-points en echec' >> "$GITHUB_STEP_SUMMARY"
          echo 'Consulter la premiere etape rouge et les rapports. Les donnees Bronze deja validees sont conservees.' >> "$GITHUB_STEP_SUMMARY"

